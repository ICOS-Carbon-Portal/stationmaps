# ICOS Station Maps: a builder that regenerates the maps every night, and nginx serving the site.
# Set BIND/PORT in .env to choose where the site is published (default 127.0.0.1:8120).
name: icosmaps

services:
  builder:
    build: .
    image: icosmaps-builder:latest
    container_name: icosmaps-builder
    restart: unless-stopped
    environment:
      BUILD_AT: "${BUILD_AT:-03:00}"  # UTC
      KEEP_RELEASES: "3"
    volumes:
      - cache:/app/cache  # downloaded metadata, ocean tracks, boundaries
      - work:/data/work   # build output; keeps the previous station list for the change report
      - site:/data/site   # published releases + `current` symlink

  web:
    image: nginx:1.27-alpine
    container_name: icosmaps-web
    restart: unless-stopped
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8120}:80"
    volumes:
      - site:/data/site:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  cache:
  work:
  site:
