# ICOS Station Maps: the API/builder (rebuilds nightly and on request) and nginx serving the site.
# Set BIND/PORT in .env to choose where the site is published (default 127.0.0.1:8120), and API_TOKEN
# to allow starting builds over the API.
name: icosmaps

services:
  api:
    build: .
    image: icosmaps-api:latest
    container_name: icosmaps-api
    restart: unless-stopped
    environment:
      BUILD_AT: "${BUILD_AT:-03:00}"  # UTC
      KEEP_RELEASES: "3"
      API_TOKEN: "${API_TOKEN:-}"
      MAPTILER_KEY: "${MAPTILER_KEY:-}"      # detailed (interactive) country maps
      MAPTILER_STYLE: "${MAPTILER_STYLE:-topo-v2}"
    volumes:
      - cache:/app/cache  # downloaded metadata, ocean tracks, boundaries
      - work:/data/work   # build output, build logs, render cache
      - site:/data/site   # published releases + `current` symlink

  web:
    image: nginx:1.27-alpine
    container_name: icosmaps-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8120}:80"
    volumes:
      - site:/data/site:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  cache:
  work:
  site:
