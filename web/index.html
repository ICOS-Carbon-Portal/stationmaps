<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICOS Station Network</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ocean: #00A6C8; --atmosphere: #E5007D; --ecosystem: #AFCA0B; --soop: #0B3B7A; }
  html, body { margin: 0; height: 100%; font-family: "Open Sans", system-ui, sans-serif; background: #fff; }
  #map { position: absolute; inset: 0; }
  .legend { background: #fff; padding: 8px 10px; font-size: 13px; line-height: 1.6; border-radius: 4px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .legend .line { border-radius: 0; height: 2px; vertical-align: 3px; }
  .meta { color: #666; font-size: 11px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Example embed for icos-ri.eu: reads the stations.geojson published next to this page by `icos-maps`.
const COLORS = { ocean: "#00A6C8", atmosphere: "#E5007D", ecosystem: "#AFCA0B" };
const map = L.map("map", { worldCopyJump: true }).setView([55, 10], 4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OpenStreetMap contributors &copy; CARTO", maxZoom: 12,
}).addTo(map);

const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = Object.entries(COLORS).map(([k, c]) => `<i style="background:${c}"></i>${k[0].toUpperCase() + k.slice(1)} Station`).join("<br>")
    + `<br><i class="line" style="background:var(--soop)"></i>Ship of Opportunity (SOOP) Line<div class="meta" id="generated"></div>`;
  return d;
};
legend.addTo(map);

function popup(p) {
  const rows = [["Station", p.name], ["ID", p.id], ["Type", p.theme_label], ["Class", p.cls], ["Labelled", p.labeled || "–"], ["Host", p.host || "–"]];
  return rows.map(([k, v]) => `<b>${k}:</b> ${v}`).join("<br>") + `<br><a href="${p.uri}" target="_blank" rel="noopener">Station page</a>`;
}

fetch("stations.geojson").then(r => r.json()).then(data => {
  const layer = L.geoJSON(data, {
    style: f => ({ color: "#0B3B7A", weight: 1.2, opacity: 0.8 }),
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      radius: 6, color: "#fff", weight: 1, fillColor: COLORS[f.properties.theme], fillOpacity: 1,
    }),
    onEachFeature: (f, l) => l.bindPopup(popup(f.properties)),
  }).addTo(map);
  layer.eachLayer(l => l.feature.geometry.type === "Point" && l.bringToFront());
});
fetch("manifest.json").then(r => r.json()).then(m => {
  document.getElementById("generated").textContent = `${m.n_stations} stations · updated ${m.generated.slice(0, 10)}`;
}).catch(() => {});
</script>
</body>
</html>
