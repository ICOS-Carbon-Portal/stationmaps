types {
    application/geo+json geojson;
}

server {
    listen 80;
    server_name _;
    root /data/site/current;
    index index.html;
    disable_symlinks off;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/csv;
    gzip_min_length 1024;

    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }
    location = /api {
        return 301 /api/;
    }

    # The app and its data change with every build: always revalidate.
    location ~* \.(html|js|css|json|geojson|csv|txt)$ {
        add_header Cache-Control "no-cache";
    }
    location /maps/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
